<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VINTAGE_STORE | لوحة تحكم الإدارة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family:'Cairo',sans-serif; background:#f8fafc; color:#0A192F; overflow-x:hidden; }
    .navy-bg { background:#0A192F; }
    .fade-in { animation:fadeIn .3s ease-in-out; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
    img { max-width:100%; }
    header.navy-bg { position:sticky; top:0; z-index:30; }
    button:active { transform:scale(.97); } tbody tr:hover { background:#f8fafc; }
    input:focus, textarea:focus, select:focus { outline:2px solid #d9c7a4; outline-offset:1px; }
  </style>
</head>
<body class="antialiased">

  <div id="toast-container" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 max-w-[92vw]"></div>
  <div id="admin-root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJt6U24C8-rDO2bfzB-7j94f5nfiley6c",
      authDomain: "vintage-store-c15cc.firebaseapp.com",
      databaseURL: "https://vintage-store-c15cc-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "vintage-store-c15cc",
      storageBucket: "vintage-store-c15cc.firebasestorage.app",
      messagingSenderId: "606228990844",
      appId: "1:606228990844:web:796fa856cde24e5c2932f9",
      measurementId: "G-TBFQSHFXS0"
    };

    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);
    const dbRef = ref(rtdb, "vintage_store_db");

    const defaultDB = {
      settings: { storeName: "VINTAGE_STORE", logoUrl: "", storeUrl: "" },
      users: [], coupons: [{ id: "c1", code: "VINTAGE20", discountPct: 20, active: true }],
      products: [], orders: []
    };

    let currentDB = JSON.parse(JSON.stringify(defaultDB));
    let prevOrdersCount = null;
    let pendingImage = null; // الصورة المختارة من الجهاز (مضغوطة) قبل الحفظ
    let loaded = false;
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";");
    const STATUS_AR = { NEW: "جديد", PENDING: "قيد المراجعة", CONFIRMED: "تم التأكيد", PROCESSING: "قيد التجهيز", SHIPPED: "تم الشحن", DELIVERED: "تم التسليم", CANCELLED: "ملغي" };
    const toArr = v => Array.isArray(v) ? v : v ? Object.values(v) : [];

    function normalizeDB(data) {
      return {
        settings: data?.settings || defaultDB.settings,
        users: data?.users || [],
        coupons: data?.coupons || [],
        products: data?.products || [],
        orders: data?.orders || []
      };
    }

    // كل تعديل يمرّ من هنا. المفتاح key = عقدة واحدة فقط (products/orders/...) بدل رفع قاعدة البيانات كاملة (سبب البطء)
    async function mutate(fn, okMsg, key) {
      let problem = null;
      try {
        const res = await runTransaction(key ? ref(rtdb, "vintage_store_db/" + key) : dbRef, (cur) => {
          problem = null;
          if (key) {
            const d = { [key]: key === "settings" ? { ...(cur || {}) } : toArr(cur) };
            const r = fn(d);
            if (typeof r === "string") { problem = r; return; }
            return d[key];
          }
          if (!cur) return cur;
          const d = normalizeDB(cur);
          const r = fn(d);
          if (typeof r === "string") { problem = r; return; }
          return d;
        });
        if (res.committed) { showToast(okMsg + " ✅ (تم الحفظ في السحابة)"); return true; }
        showToast(problem || "لم يتم الحفظ، حاول مرة أخرى", true);
      } catch (e) {
        showToast("❌ فشل الحفظ: " + (e.code || e.message), true);
      }
      render();
      return false;
    }

    // مستمع مستقل لكل عقدة: وصول طلب جديد لا يعيد تحميل صور المنتجات
    const got = new Set();
    ["settings", "users", "coupons", "products", "orders"].forEach(k => onValue(ref(rtdb, "vintage_store_db/" + k), (snap) => {
      const val = snap.val();
      state.err = null;
      if (k === "settings") {
        if (!val) set(ref(rtdb, "vintage_store_db/settings"), defaultDB.settings).catch(e => showToast("❌ تعذّرت التهيئة: " + e.code, true));
        currentDB.settings = val || defaultDB.settings;
      } else currentDB[k] = toArr(val);
      if (k === "orders") {
        if (prevOrdersCount !== null && currentDB.orders.length > prevOrdersCount) showToast("🔔 وصل طلب جديد من أحد الزبائن الآن!");
        prevOrdersCount = currentDB.orders.length;
      }
      got.add(k); if (got.size === 5) loaded = true;
      safeRender();
    }, (error) => {
      state.err = error.code || "ERROR";
      showToast("❌ تعذّرت القراءة من Firebase: " + state.err, true);
      render();
    }));

    onValue(ref(rtdb, ".info/connected"), (snap) => { state.online = snap.val() === true; if (state.isAuthenticated) render(); });

    let state = {
      isAuthenticated: sessionStorage.getItem("admin_logged_in") === "true",
      tab: "PRODUCTS", editingProductId: null, online: false, err: null, dirty: false, orderFilter: "ALL"
    };

    // لا نعيد رسم الصفحة وأنت تكتب في نموذج حتى لا يضيع ما كتبتِ
    function safeRender() {
      const a = document.activeElement;
      const typing = a && ["INPUT", "TEXTAREA", "SELECT"].includes(a.tagName) && a.type !== "checkbox" && document.getElementById("admin-root").contains(a) && state.tab !== "ORDERS";
      if (typing) { state.dirty = true; return; }
      render();
    }
    document.addEventListener("focusout", () => { if (state.dirty) setTimeout(() => { if (state.dirty) { state.dirty = false; render(); } }, 300); });

    window.showToast = function(msg, isError = false) {
      const container = document.getElementById("toast-container");
      const el = document.createElement("div");
      el.className = `px-6 py-3 rounded-xl shadow-xl text-sm font-bold fade-in ${isError ? "bg-red-600 text-white" : "navy-bg text-white border border-white/20"}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    };

    window.loginAdmin = function(e) {
      e.preventDefault();
      const email = document.getElementById("adm-email").value.trim();
      const pass = document.getElementById("adm-pass").value.trim();
      if (email === "admin@vintage.com" && pass === "admin123") {
        state.isAuthenticated = true;
        sessionStorage.setItem("admin_logged_in", "true");
        render();
      } else showToast("بيانات المدير غير صحيحة!", true);
    };

    window.logoutAdmin = function() {
      state.isAuthenticated = false;
      sessionStorage.removeItem("admin_logged_in");
      render();
    };

    window.setOrderFilter = function(v) { state.orderFilter = v; render(); };
    window.switchTab = function(tabId) { state.tab = tabId; state.dirty = false; pendingImage = null; render(); };

    // تصغير وضغط الصورة داخل المتصفح قبل حفظها (حتى لا يثقل المتجر على الزبائن)
    function compressImage(file, maxSide = 640) {
      return new Promise((resolve, reject) => {
        if (!file.type.startsWith("image/")) return reject(new Error("اختاري ملف صورة (JPG أو PNG)"));
        if (file.size > 20 * 1024 * 1024) return reject(new Error("الصورة كبيرة جداً (أكثر من 20MB)"));
        const img = new Image(), url = URL.createObjectURL(file);
        img.onload = () => {
          const k = Math.min(1, maxSide / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          const ctx = c.getContext("2d");
          ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          let q = 0.8, out = c.toDataURL("image/jpeg", q);
          while (out.length > 90000 && q > 0.3) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
          resolve(out);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("تعذّر قراءة الصورة، جرّبي JPG أو PNG")); };
        img.src = url;
      });
    }

    window.pickImage = async function(input) {
      const f = input.files && input.files[0];
      if (!f) return;
      try {
        pendingImage = await compressImage(f);
        const pv = document.getElementById("p-preview");
        if (pv) { pv.src = pendingImage; pv.classList.remove("hidden"); }
        showToast(`تم تجهيز الصورة (${Math.round(pendingImage.length / 1024)} KB) ✅`);
      } catch (err) {
        pendingImage = null;
        input.value = "";
        showToast(err.message, true);
      }
    };

    window.handleSaveProduct = async function(e) {
      e.preventDefault();
      const name = document.getElementById("p-name").value.trim();
      const description = document.getElementById("p-desc").value.trim();
      const price = parseFloat(document.getElementById("p-price").value);
      const category = document.getElementById("p-cat").value;
      const urlTyped = document.getElementById("p-img").value.trim();
      const existingImage = state.editingProductId ? currentDB.products.find(p => p.id === state.editingProductId)?.image : "";
      const image = pendingImage || urlTyped || existingImage || "https://images.unsplash.com/photo-1523381210434-271e8be1f52b?auto=format&fit=crop&w=800&q=80";
      const isFeatured = document.getElementById("p-feat").checked;
      const color = document.getElementById("p-color").value.trim();
      const sizes = [...new Set(document.getElementById("p-sizes").value.split(",").map(s => s.trim()).filter(Boolean))];
      const stock = parseInt(document.getElementById("p-stock").value);
      if (!name || !(price > 0) || !sizes.length || !Number.isInteger(stock) || stock < 0) return showToast("تحقق من الاسم والسعر والمقاسات والمخزون", true);

      const editingId = state.editingProductId;
      const stamp = Date.now();
      const ok = await mutate((d) => {
        const old = editingId ? d.products.find(p => p.id === editingId) : null;
        if (editingId && !old) return "المنتج لم يعد موجوداً";
        // نحافظ على أرقام المتغيرات القديمة كي لا تنكسر سلات الزبائن
        const variants = sizes.map((sz, idx) => {
          const prev = (old?.variants || []).find(v => v.size === sz && v.color === color);
          return { id: prev?.id || "v_" + stamp + "_" + idx, color, colorHex: "#0A192F", size: sz, stock };
        });
        const data = { name, description, price, category, image, isFeatured, variants };
        if (old) Object.assign(old, data);
        else d.products.unshift({ id: "p_" + stamp, ...data });
      }, editingId ? "تم تعديل المنتج" : "تم نشر المنتج", "products");
      if (ok) { state.editingProductId = null; pendingImage = null; state.dirty = false; render(); }
    };

    window.startEditProduct = function(id) { state.editingProductId = id; pendingImage = null; render(); };
    window.cancelEditProduct = function() { state.editingProductId = null; pendingImage = null; render(); };

    window.deleteProduct = async function(id) {
      if (!confirm("حذف هذا المنتج نهائياً؟")) return;
      await mutate((d) => { d.products = d.products.filter(p => p.id !== id); }, "تم حذف المنتج", "products");
    };

    // تغيير الحالة؛ الإلغاء يعيد الكمية للمخزون، والتراجع عن الإلغاء يخصمها من جديد
    window.updateOrderStatus = async function(orderId, newStatus) {
      const cur0 = currentDB.orders.find(x => x.id === orderId);
      if (cur0 && (cur0.status === "CANCELLED") === (newStatus === "CANCELLED")) { // تغيير عادي: يمس عقدة الطلبات فقط
        return mutate((d) => { const o = d.orders.find(x => x.id === orderId); if (!o) return "الطلب غير موجود"; o.status = newStatus; }, "تم تحديث الحالة إلى " + STATUS_AR[newStatus], "orders");
      }
      await mutate((d) => {
        const o = d.orders.find(x => x.id === orderId);
        if (!o) return "الطلب غير موجود";
        const was = o.status === "CANCELLED", will = newStatus === "CANCELLED";
        if (was !== will) {
          const all = d.products.flatMap(p => p.variants || []);
          for (const i of o.items || []) {
            const v = all.find(x => x.id === i.variantId);
            if (!v) continue;
            v.stock += will ? i.quantity : -i.quantity;
            if (v.stock < 0) return "لا يوجد مخزون كافٍ لإعادة تفعيل هذا الطلب";
          }
        }
        o.status = newStatus;
      }, "تم تحديث الحالة إلى " + newStatus);
    };

    // يحذف الصور المضمّنة داخل الطلبات القديمة (كانت تثقل كل تحميل)
    window.slimOrders = () => mutate((d) => { d.orders.forEach(o => (o.items || []).forEach(i => { delete i.image; })); }, "تم تخفيف الطلبات", "orders");

    window.addCoupon = async function(e) {
      e.preventDefault();
      const code = document.getElementById("nc-code").value.trim().toUpperCase();
      const pct = Number(document.getElementById("nc-pct").value);
      if (!code || !(pct > 0 && pct <= 100)) return showToast("أدخل كوداً ونسبة بين 1 و100", true);
      const ok = await mutate((d) => {
        if (d.coupons.some(c => c.code === code)) return "هذا الكود موجود مسبقاً";
        d.coupons.push({ id: "c" + Date.now(), code, discountPct: pct, active: true });
      }, "تمت إضافة الكوبون", "coupons");
      if (ok) { state.dirty = false; render(); }
    };

    window.saveSettings = async function(e) {
      e.preventDefault();
      const wa = document.getElementById("st-wa").value.replace(/[\s+\-()]/g, "");
      if (wa && !/^[1-9]\d{8,14}$/.test(wa)) return showToast("اكتبي رقم واتساب بصيغة دولية بدون + وبدون صفر في البداية، مثال: 970599123456", true);
      const s = {
        whatsapp: wa,
        ejsService: document.getElementById("st-ejs-s").value.trim(),
        ejsTemplate: document.getElementById("st-ejs-t").value.trim(),
        ejsKey: document.getElementById("st-ejs-k").value.trim(),
        cmbKey: document.getElementById("st-cmb").value.trim(),
        storeName: document.getElementById("st-name").value.trim() || "VINTAGE_STORE",
        logoUrl: document.getElementById("st-logo").value.trim(),
        storeUrl: document.getElementById("st-url").value.trim()
      };
      const ok = await mutate((d) => { d.settings = { ...d.settings, ...s }; }, "تم حفظ الإعدادات", "settings");
      if (ok) { state.dirty = false; generateStoreQR(); }
    };

    window.testWhatsApp = function() {
      const num = document.getElementById("st-wa").value.replace(/\D/g, "");
      const key = document.getElementById("st-cmb").value.trim();
      if (!num || !key) return showToast("اكتبي الرقم والمفتاح أولاً", true);
      fetch("https://api.callmebot.com/whatsapp.php?phone=%2B" + num + "&text=" + encodeURIComponent("رسالة تجريبية من VINTAGE_STORE ✅ إذا وصلتك فالإشعارات شغالة") + "&apikey=" + encodeURIComponent(key), { mode: "no-cors" })
        .then(() => showToast("أُرسل الطلب للخدمة، انتظري الرسالة على واتساب خلال دقيقة"))
        .catch(() => showToast("تعذّر الاتصال بالخدمة", true));
    };

    window.generateStoreQR = function() {
      const container = document.getElementById("qrcode-container");
      if (!container) return;
      container.innerHTML = "";
      const inputEl = document.getElementById("st-url");
      const url = (inputEl ? inputEl.value.trim() : "") || currentDB.settings.storeUrl || window.location.href.replace("admin.html", "index.html");
      new QRCode(container, { text: url, width: 190, height: 190, colorDark: "#0A192F", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
    };

    window.downloadQR = function() {
      const canvas = document.querySelector("#qrcode-container canvas");
      if (!canvas) return showToast("يرجى توليد الرمز أولاً", true);
      const link = document.createElement("a");
      link.download = "store-qr-code.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
      showToast("تم تحميل صورة الـ QR بنجاح ✅");
    };

    function render() {
      const root = document.getElementById("admin-root");

      if (!state.isAuthenticated) {
        root.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4">
            <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl border space-y-6">
              <div class="text-center">
                <div class="w-14 h-14 navy-bg text-white rounded-2xl flex items-center justify-center mx-auto font-extrabold text-2xl mb-3">A</div>
                <h1 class="text-2xl font-extrabold">تسجيل دخول الإدارة</h1>
              </div>
              <form onsubmit="loginAdmin(event)" class="space-y-4">
                <input id="adm-email" type="email" required placeholder="البريد الإلكتروني" class="w-full border rounded-xl p-3.5 text-sm" />
                <input id="adm-pass" type="password" required placeholder="كلمة المرور" class="w-full border rounded-xl p-3.5 text-sm" />
                <button type="submit" class="w-full navy-bg text-white py-3.5 rounded-xl font-extrabold">دخول للوحة التحكم</button>
              </form>
            </div>
          </div>`;
        return;
      }

      const db = currentDB;
      const valid = db.orders.filter(o => o.status !== "CANCELLED");
      const newOrdersCount = db.orders.filter(o => o.status === "NEW").length;
      const totalSales = valid.reduce((s, o) => s + (o.totalAmount || 0), 0);
      const editProd = state.editingProductId ? db.products.find(p => p.id === state.editingProductId) : null;
      const low = db.products.flatMap(p => (p.variants || []).filter(v => v.stock <= 3).map(v => ({ name: p.name, color: v.color, size: v.size, stock: v.stock })));
      const imgKB = Math.round(db.products.reduce((s, p) => s + (String(p.image || "").startsWith("data:") ? p.image.length : 0), 0) / 1024);
      const shownOrders = db.orders.filter(o => state.orderFilter === "ALL" || o.status === state.orderFilter);
      const heavy = db.orders.filter(o => (o.items || []).some(i => String(i.image || "").startsWith("data:"))).length;
      const badge = state.err
        ? `<span class="text-xs bg-red-500/20 text-red-200 border border-red-400/40 px-3 py-1.5 rounded-full font-bold">● خطأ: ${esc(state.err)}</span>`
        : state.online && loaded
          ? `<span class="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-3 py-1.5 rounded-full font-bold">● متصل بالسحابة</span>`
          : `<span class="text-xs bg-amber-500/20 text-amber-200 border border-amber-400/40 px-3 py-1.5 rounded-full font-bold">● غير متصل، التعديلات لن تصل</span>`;

      root.innerHTML = `
        <header class="navy-bg text-white px-4 sm:px-6 py-4 shadow-md flex flex-wrap justify-between items-center gap-4">
          <div class="flex items-center gap-3">
            <span class="bg-white text-[#0A192F] font-extrabold px-3 py-1 rounded-lg text-sm">ADMIN PANEL</span>
            <span class="font-extrabold text-lg tracking-wider">${esc(db.settings.storeName)}</span>
          </div>
          <div class="flex items-center gap-4">${badge}<button onclick="logoutAdmin()" class="text-xs text-slate-300 hover:text-white">خروج</button></div>
        </header>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
          <div class="flex flex-wrap gap-2 mb-8">
            ${[
              { id: "OVERVIEW", label: "الإحصائيات" },
              { id: "PRODUCTS", label: `إدارة المنتجات (${db.products.length})` },
              { id: "ORDERS", label: `الطلبات الواردة (${db.orders.length}) ${newOrdersCount > 0 ? "🔴 " + newOrdersCount : ""}` },
              { id: "CUSTOMERS", label: `الزبائن (${db.users.length})` },
              { id: "COUPONS", label: "الكوبونات" },
              { id: "SETTINGS", label: "هوية المتجر و QR" }
            ].map(t => `<button onclick="switchTab('${t.id}')" class="px-4 sm:px-5 py-2.5 rounded-xl text-xs sm:text-sm font-extrabold transition ${state.tab === t.id ? "navy-bg text-white shadow" : "bg-white border text-[#0A192F] hover:bg-slate-100"}">${t.label}</button>`).join("")}
          </div>

          ${state.tab === "OVERVIEW" ? `
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 sm:gap-6">
              <div class="navy-bg text-white p-5 sm:p-6 rounded-3xl"><span class="text-xs text-slate-300">إجمالي المبيعات (بدون الملغاة)</span><p class="text-2xl sm:text-3xl font-extrabold mt-2">$${totalSales.toFixed(2)}</p></div>
              <div class="bg-white border p-5 sm:p-6 rounded-3xl"><span class="text-xs text-slate-500">عدد الطلبات</span><p class="text-2xl sm:text-3xl font-extrabold mt-2">${db.orders.length}</p></div>
              <div class="bg-white border p-5 sm:p-6 rounded-3xl"><span class="text-xs text-emerald-600 font-bold">طلبات جديدة</span><p class="text-2xl sm:text-3xl font-extrabold mt-2 text-emerald-600">${newOrdersCount}</p></div>
              <div class="bg-white border p-5 sm:p-6 rounded-3xl"><span class="text-xs text-slate-500">عدد المنتجات</span><p class="text-2xl sm:text-3xl font-extrabold mt-2">${db.products.length}</p></div>
            </div>
            <div class="grid lg:grid-cols-2 gap-6 mt-6">
              <div class="bg-white border rounded-3xl p-5">
                <h3 class="font-extrabold mb-3">آخر الطلبات</h3>
                ${db.orders.slice(0, 5).map(o => `<div class="flex justify-between items-center border-b py-2 text-sm last:border-0"><div><b>${esc(o.orderNumber)}</b> <span class="text-xs text-slate-500">${esc(o.customerName)}</span></div><div class="text-left"><b>$${(o.totalAmount || 0).toFixed(2)}</b><div class="text-[10px] text-slate-400">${STATUS_AR[o.status] || esc(o.status)}</div></div></div>`).join("") || `<p class="text-sm text-slate-500">لا توجد طلبات بعد</p>`}
              </div>
              <div class="bg-white border rounded-3xl p-5">
                <h3 class="font-extrabold mb-3">تنبيهات المخزون (3 قطع أو أقل)</h3>
                ${low.map(l => `<div class="flex justify-between border-b py-2 text-sm last:border-0"><span>${esc(l.name)} <span class="text-xs text-slate-500">(${esc(l.color)} / ${esc(l.size)})</span></span><b class="${l.stock === 0 ? "text-red-600" : "text-amber-600"}">${l.stock === 0 ? "نفد" : "باقي " + l.stock}</b></div>`).join("") || `<p class="text-sm text-slate-500">لا توجد تنبيهات، المخزون جيد ✅</p>`}
              </div>
            </div>` : ""}

          ${state.tab === "PRODUCTS" ? `
            <div class="grid lg:grid-cols-3 gap-8">
              <form onsubmit="handleSaveProduct(event)" class="bg-white p-6 rounded-3xl border shadow-sm space-y-4 h-fit">
                <div class="flex justify-between items-center">
                  <h3 class="font-extrabold text-lg">${editProd ? "تعديل المنتج" : "إضافة منتج جديد"}</h3>
                  ${editProd ? `<button type="button" onclick="cancelEditProduct()" class="text-xs text-red-600 font-bold">إلغاء التعديل</button>` : ""}
                </div>
                <input id="p-name" required value="${esc(editProd?.name)}" placeholder="اسم المنتج" class="w-full border rounded-xl p-3 text-sm" />
                <textarea id="p-desc" required rows="2" placeholder="وصف المنتج" class="w-full border rounded-xl p-3 text-sm">${esc(editProd?.description)}</textarea>
                <div class="grid grid-cols-2 gap-3">
                  <input id="p-price" required type="number" step="0.01" min="0.01" value="${editProd?.price ?? ""}" placeholder="السعر ($)" class="border rounded-xl p-3 text-sm min-w-0" />
                  <select id="p-cat" class="border rounded-xl p-3 text-sm bg-white font-bold min-w-0">
                    ${["Men", "Women", "Kids", "Accessories", "New Arrivals", "Best Sellers"].map(c => `<option value="${c}" ${editProd?.category === c ? "selected" : ""}>${c}</option>`).join("")}
                  </select>
                </div>
                <div class="space-y-2">
                  <label class="text-xs font-bold block">صورة المنتج (اختاريها من جهازك)</label>
                  <img id="p-preview" src="${esc(pendingImage || editProd?.image || "")}" class="${pendingImage || editProd?.image ? "" : "hidden "}h-40 w-32 object-cover rounded-xl border" />
                  <input id="p-file" type="file" accept="image/*" onchange="pickImage(this)" class="w-full text-xs file:ml-3 file:rounded-lg file:border-0 file:bg-slate-100 file:px-3 file:py-2 file:text-xs file:font-bold" />
                  <input id="p-img" value="${esc(String(editProd?.image || "").startsWith("http") ? editProd.image : "")}" placeholder="أو الصقي رابط صورة (اختياري)" class="w-full border rounded-xl p-3 text-sm" dir="ltr" />
                </div>
                <div class="grid grid-cols-3 gap-2">
                  <input id="p-color" required value="${esc(editProd?.variants?.[0]?.color || "كحلي")}" placeholder="اللون" class="border rounded-xl p-3 text-sm min-w-0" />
                  <input id="p-sizes" required value="${esc(editProd?.variants ? editProd.variants.map(v => v.size).join(", ") : "S, M, L")}" placeholder="المقاسات" class="border rounded-xl p-3 text-sm min-w-0" />
                  <input id="p-stock" required type="number" min="0" value="${editProd?.variants?.[0]?.stock ?? 10}" placeholder="المخزون" class="border rounded-xl p-3 text-sm min-w-0" />
                </div>
                <label class="flex items-center gap-2 text-xs font-bold"><input id="p-feat" type="checkbox" ${editProd?.isFeatured ? "checked" : ""} /> تمييز المنتج (Featured)</label>
                <button type="submit" class="w-full navy-bg text-white py-3.5 rounded-xl font-extrabold text-sm">${editProd ? "حفظ التعديلات وتحديث المتجر" : "نشر المنتج للزبائن"}</button>
              </form>

              <div class="lg:col-span-2 space-y-3">
                <p class="text-xs text-slate-500">حجم الصور المحفوظة: ${imgKB} KB (الزبون يحمّلها كلها عند فتح المتجر، فاختاري صوراً معقولة)</p>
                ${db.products.length === 0 ? `<p class="bg-white border rounded-2xl p-8 text-center text-slate-500 text-sm">لا توجد منتجات بعد</p>` : db.products.map(p => `
                  <div class="bg-white border p-4 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div class="flex items-center gap-4 min-w-0">
                      <img src="${esc(p.image)}" class="w-16 h-20 object-cover rounded-xl border shrink-0" />
                      <div class="min-w-0">
                        <h4 class="font-extrabold">${esc(p.name)}</h4>
                        <p class="text-xs text-slate-500">${esc(p.category)} | $${p.price} | المخزون: ${(p.variants || []).reduce((a, b) => a + b.stock, 0)}</p>
                        <p class="text-[11px] text-slate-400">المقاسات: ${(p.variants || []).map(v => `${esc(v.size)}(${v.stock})`).join(" - ")}</p>
                      </div>
                    </div>
                    <div class="flex gap-2">
                      <button onclick="startEditProduct('${p.id}')" class="bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-xl text-xs font-bold">تعديل</button>
                      <button onclick="deleteProduct('${p.id}')" class="bg-red-50 text-red-600 hover:bg-red-100 px-4 py-2 rounded-xl text-xs font-bold">حذف</button>
                    </div>
                  </div>`).join("")}
              </div>
            </div>` : ""}

          ${state.tab === "ORDERS" ? `
            ${heavy ? `<button onclick="slimOrders()" class="mb-3 rounded-xl bg-amber-500 px-4 py-2 text-xs font-bold text-white">⚡ تخفيف ${heavy} طلب قديم (حذف الصور المضمّنة لتسريع المتجر)</button>` : ""}
            <div class="flex gap-2 overflow-x-auto pb-3">
              ${["ALL", "NEW", "PENDING", "CONFIRMED", "PROCESSING", "SHIPPED", "DELIVERED", "CANCELLED"].map(f => `<button onclick="setOrderFilter('${f}')" class="whitespace-nowrap rounded-full border px-4 py-1.5 text-xs font-bold ${state.orderFilter === f ? "navy-bg text-white" : "bg-white hover:bg-slate-100"}">${f === "ALL" ? "الكل" : STATUS_AR[f]} (${f === "ALL" ? db.orders.length : db.orders.filter(o => o.status === f).length})</button>`).join("")}
            </div>
            <div class="bg-white border rounded-3xl overflow-x-auto">
              <table class="w-full text-right text-sm">
                <thead class="navy-bg text-white text-xs"><tr><th class="p-4">رقم الطلب</th><th class="p-4">الزبون والعنوان</th><th class="p-4">المنتجات المطلوبة</th><th class="p-4">الإجمالي</th><th class="p-4">الحالة</th></tr></thead>
                <tbody class="divide-y">
                  ${shownOrders.length === 0 ? `<tr><td colspan="5" class="p-8 text-center text-slate-500">لا توجد طلبات في هذه الحالة</td></tr>` : shownOrders.map(o => `
                    <tr class="${o.status === "NEW" ? "bg-blue-50/50" : ""}">
                      <td class="p-4 font-extrabold whitespace-nowrap">${esc(o.orderNumber)}<div class="text-[10px] text-slate-400 font-normal">${esc(o.createdAt)}</div></td>
                      <td class="p-4 min-w-[200px]"><div class="font-bold">${esc(o.customerName)}</div><div class="text-xs text-slate-500">${esc(o.customerPhone)} | ${esc(o.shippingAddress)}</div></td>
                      <td class="p-4 text-xs min-w-[180px]">${(o.items || []).map(i => `<div>• ${esc(i.name)} (${esc(i.color)} / ${esc(i.size)}) × ${i.quantity}</div>`).join("")}</td>
                      <td class="p-4 font-extrabold whitespace-nowrap">$${(o.totalAmount || 0).toFixed(2)}</td>
                      <td class="p-4">
                        <select onchange="updateOrderStatus('${o.id}', this.value)" class="border rounded-xl px-3 py-1.5 text-xs font-bold ${o.status === "CANCELLED" ? "bg-red-50 text-red-700" : o.status === "DELIVERED" ? "bg-emerald-50 text-emerald-700" : o.status === "NEW" ? "bg-blue-50 text-blue-700" : ""}">
                          ${["NEW", "PENDING", "CONFIRMED", "PROCESSING", "SHIPPED", "DELIVERED", "CANCELLED"].map(st => `<option value="${st}" ${o.status === st ? "selected" : ""}>${STATUS_AR[st]}</option>`).join("")}
                        </select>
                      </td>
                    </tr>`).join("")}
                </tbody>
              </table>
            </div>` : ""}

          ${state.tab === "CUSTOMERS" ? `
            <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
              ${db.users.length === 0 ? `<p class="text-slate-500 text-sm">لا يوجد زبائن مسجلون بعد</p>` : db.users.map(u => {
                const mine = db.orders.filter(o => o.userId === u.id);
                const spent = mine.filter(o => o.status !== "CANCELLED").reduce((s, o) => s + (o.totalAmount || 0), 0);
                return `<div class="bg-white border p-5 rounded-2xl"><h4 class="font-bold">${esc(u.name)}</h4><p class="text-xs text-slate-500">${esc(u.email)} | ${esc(u.phone)}</p><p class="text-xs mt-2 font-bold">الطلبات: ${mine.length} | المشتريات: $${spent.toFixed(2)}</p></div>`;
              }).join("")}
            </div>` : ""}

          ${state.tab === "COUPONS" ? `
            <div class="max-w-md space-y-4">
              <form onsubmit="addCoupon(event)" class="flex gap-2">
                <input id="nc-code" required placeholder="الكود" class="flex-1 min-w-0 border rounded-xl p-3 text-sm uppercase" />
                <input id="nc-pct" required type="number" min="1" max="100" placeholder="%" class="w-24 border rounded-xl p-3 text-sm" />
                <button type="submit" class="navy-bg text-white px-5 rounded-xl font-bold text-sm">إضافة</button>
              </form>
              ${db.coupons.map(c => `<div class="bg-white border p-3 rounded-xl flex justify-between font-bold text-sm"><span>${esc(c.code)}</span><span class="text-emerald-600">${c.discountPct}%</span></div>`).join("")}
            </div>` : ""}

          ${state.tab === "SETTINGS" ? `
            <div class="grid md:grid-cols-2 gap-8">
              <form onsubmit="saveSettings(event)" class="bg-white border p-6 rounded-3xl space-y-4 h-fit">
                <h3 class="font-extrabold text-lg">إعدادات المتجر والرابط</h3>
                <div><label class="text-xs font-bold block mb-1">اسم المتجر</label><input id="st-name" required value="${esc(db.settings.storeName)}" class="w-full border rounded-xl p-3 text-sm font-bold" /></div>
                <div><label class="text-xs font-bold block mb-1">رابط الشعار (URL)</label><input id="st-logo" value="${esc(db.settings.logoUrl)}" placeholder="https://..." class="w-full border rounded-xl p-3 text-sm" dir="ltr" /></div>
                <div><label class="text-xs font-bold block mb-1">رابط متجر الزبائن (لإنشاء الـ QR)</label><input id="st-url" value="${esc(db.settings.storeUrl)}" placeholder="https://اسم-حسابك.github.io/VINTAGE/" class="w-full border rounded-xl p-3 text-sm text-left" dir="ltr" /></div>
                <div><label class="text-xs font-bold block mb-1">رقم واتساب الإدارة الذي تصله الطلبات (دولي، بدون + وبدون صفر)</label><input id="st-wa" value="${esc(db.settings.whatsapp)}" placeholder="مثال: 970599123456" class="w-full border rounded-xl p-3 text-sm text-left" dir="ltr" inputmode="numeric" /></div>
                <div><label class="text-xs font-bold block mb-1">مفتاح CallMeBot (لازم ليصلك الطلب على واتساب تلقائياً)</label><input id="st-cmb" value="${esc(db.settings.cmbKey)}" placeholder="المفتاح الذي يرسله لك البوت" class="w-full border rounded-xl p-3 text-sm text-left" dir="ltr" /></div>
                <button type="button" onclick="testWhatsApp()" class="w-full bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold text-sm">إرسال رسالة تجريبية لواتساب الإدارة</button>
                <div class="rounded-2xl border border-dashed p-4 space-y-3">
                  <p class="text-xs font-bold">رسالة الترحيب بالإيميل (EmailJS) — تُرسل للزبون عند إنشاء حسابه</p>
                  <input id="st-ejs-s" value="${esc(db.settings.ejsService)}" placeholder="Service ID (مثال: service_xxxxx)" class="w-full border rounded-xl p-3 text-sm text-left" dir="ltr" />
                  <input id="st-ejs-t" value="${esc(db.settings.ejsTemplate)}" placeholder="Template ID (مثال: template_xxxxx)" class="w-full border rounded-xl p-3 text-sm text-left" dir="ltr" />
                  <input id="st-ejs-k" value="${esc(db.settings.ejsKey)}" placeholder="Public Key" class="w-full border rounded-xl p-3 text-sm text-left" dir="ltr" />
                </div>
                <button type="submit" class="w-full navy-bg text-white px-6 py-3.5 rounded-xl font-bold text-sm">حفظ وتحديث الرمز</button>
              </form>
              <div class="bg-white border p-6 rounded-3xl flex flex-col items-center text-center space-y-4">
                <h3 class="font-extrabold text-lg">رمز QR لتسوق الزبائن</h3>
                <p class="text-xs text-slate-500">امسح الرمز بكاميرا الهاتف أو اطبعه ليدخل الزبائن للمتجر مباشرة</p>
                <div id="qrcode-container" class="p-4 bg-white border-2 border-dashed border-slate-300 rounded-2xl flex items-center justify-center min-h-[220px] min-w-[220px]"></div>
                <button onclick="downloadQR()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-bold text-sm">تحميل صورة QR للطباعة</button>
              </div>
            </div>` : ""}
        </div>`;
      lucide.createIcons();
      if (state.tab === "SETTINGS") setTimeout(generateStoreQR, 50);
    }

    render();
  </script>
</body>
</html>
